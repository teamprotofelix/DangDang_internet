name: DangDang CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and prepare PDF parser
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in ./*.js ./*.mjs ./scripts/*.mjs ./tests/*.cjs; do
            node --check "$file"
          done

      - name: Validate Chrome manifest
        run: node scripts/check-manifest.mjs

      - name: Test functionality with synthetic fixtures
        run: npm test

      - name: Build installable extension with PDF.js
        run: npm run package:extension

      - name: Unpack the installable ZIP for browser tests
        run: |
          (cd dist/DangDang_internet && zip -qr ../installable.zip .)
          unzip -q dist/installable.zip -d dist/extension-smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Load unpacked extension and exercise core workflows
        run: npm run test:browser
        env:
          DANGDANG_EXTENSION_DIR: dist/extension-smoke

      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: DangDang_internet_Chrome
          path: dist/DangDang_internet/
          if-no-files-found: error
